name: Smart Image Splitter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust-python-engine:
    name: Rust PyO3 + Python Package Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python build & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel setuptools-rust maturin pytest numpy opencv-python-headless pillow
      - name: Verify root pip install (pip install git+... simulation)
        run: |
          pip install --no-build-isolation .
          python -c "from smart_splitter import SmartSplitter; from smart_splitter.engine import HAS_RUST_CORE; assert HAS_RUST_CORE"
          pytest -v tests/
      - name: Check Rust crate & build with maturin
        run: |
          cargo check --all-targets
          maturin build --release --out dist --find-interpreter
          pip install --force-reinstall dist/*.whl
          pytest -v tests/
