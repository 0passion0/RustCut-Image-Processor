[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "smart-image-splitter"
version = "0.2.0"
description = "Ultra-fast Rust + OpenCV hybrid image splitter for composite grids, slides, collages, and isolated objects."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.18",
    "torch>=2.2",
]

[project.scripts]
smart-split = "smart_splitter.cli:main"

[tool.maturin]
python-source = "python"
module-name = "smart_splitter._core"
features = ["pyo3/extension-module"]
