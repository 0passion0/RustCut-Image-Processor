[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-image-splitter"
version = "0.2.4"
description = "High-performance pure-Rust (PyO3 + Rayon) image splitter with XY-Cut BSP, gutter collapsing, bleed decontamination, uniform output sizing, and contour extraction."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0 OR MIT"
authors = [{ name = "0passion0" }, { name = "SliceCraft Contributors" }]
keywords = ["image-splitting", "computer-vision", "rust", "pyo3", "xy-cut"]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/0passion0/RustCut-Image-Processor"
Repository = "https://github.com/0passion0/RustCut-Image-Processor"
Issues = "https://github.com/0passion0/RustCut-Image-Processor/issues"

[project.optional-dependencies]
ml = ["onnxruntime>=1.18", "torch>=2.2"]
dev = ["pytest>=8.0", "maturin>=1.7"]

[project.scripts]
smart-split = "smart_splitter.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.maturin]
python-source = "python"
module-name = "smart_splitter._core"
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
