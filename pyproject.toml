[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-image-splitter"
version = "0.2.0"
description = "High-performance hybrid Rust (PyO3 + Rayon) and OpenCV image splitter with XY-Cut BSP, gutter collapsing, bleed decontamination, and contour extraction."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SliceCraft Contributors" }]
keywords = ["image-splitting", "computer-vision", "rust", "pyo3", "opencv", "xy-cut"]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
]

[project.optional-dependencies]
ml = ["onnxruntime>=1.18", "torch>=2.2"]
dev = ["pytest>=8.0", "maturin>=1.7"]

[project.scripts]
smart-split = "smart_splitter.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.maturin]
python-source = "python"
module-name = "smart_splitter._core"
features = ["pyo3/extension-module"]
